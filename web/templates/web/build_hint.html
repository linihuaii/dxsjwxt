<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week9 前后端网页</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: #f5f6f8;
            color: #24292f;
            display: flex;
            justify-content: center;
            padding: 80px 24px;
        }
        .box {
            max-width: 640px;
            background: #fff;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 32px;
        }
        h1 { font-size: 22px; color: #0969da; margin-bottom: 16px; }
        p { color: #57606a; line-height: 1.8; margin-bottom: 12px; }
        code {
            background: #eff1f3;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 14px;
            color: #24292f;
        }
        pre {
            background: #24292f;
            color: #e6edf3;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>前端尚未构建</h1>
        <p>Vue 单页应用的构建产物还没有生成。在 <code>frontend/</code> 目录下执行：</p>
        <pre>npm install
npm run build</pre>
        <p>构建完成后刷新本页即可看到 Vue 前端页面。</p>
        <p>开发调试时也可以直接运行 <code>npm run dev</code>，启动 Vite 开发服务器（默认 5173 端口），它会把 <code>/api</code> 请求代理到 Django。</p>
    </div>
</body>
</html>
